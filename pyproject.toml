[project]
name = "filemanagementsystem"
version = "0.1.0"
description = "MCP server for file management"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.15.0",
    "smithery>=0.4.2",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
    "pydantic>=2.0.0",
    "sse-starlette>=1.6.0"
]

[project.scripts]
dev = "smithery.cli.dev:main"
playground = "smithery.cli.playground:main"

[tool.smithery]
server = "filemanagementsystem.server:create_server"
